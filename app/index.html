<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, user-scalable=no">
    <title>HomeDock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Two layers so wallpapers can crossfade -->
    <div id="bgA" class="bg"></div>
    <div id="bgB" class="bg"></div>
    <div id="shade"></div>

    <div id="brand">
        <svg viewBox="0 0 24 24" width="44" height="44"><rect x="2" y="5" width="20" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 2l4 3 4-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span id="brandName"></span>
    </div>

    <div id="info">
        <div id="time"></div>
        <div id="date"></div>
        <div id="now"></div>
        <div id="forecast" class="glass"></div>
    </div>

    <div id="dockWrap">
        <div id="dock" class="glass"><div id="strip"></div></div>
        <div id="label"></div>
    </div>

    <div id="credit"></div>
    <div id="toast"></div>

    <!-- Add-app picker -->
    <div id="picker" class="overlay">
        <div class="sheet">
            <div class="sheetTitle" data-i18n="addApp"></div>
            <div id="pickView" class="view"><div id="pickGrid" class="grid"></div></div>
        </div>
    </div>

    <!-- Hold OK on a dock app: move / remove -->
    <div id="menu" class="overlay">
        <div class="dialog glass">
            <div class="sheetTitle" id="menuTitle"></div>
            <div id="menuList"></div>
        </div>
    </div>

    <!-- Settings (red button) -->
    <div id="settings" class="overlay">
        <div class="dialog glass wide">
            <div class="sheetTitle" data-i18n="settings"></div>
            <label data-i18n="location"></label>
            <div class="btn row" id="btnLoc" data-base="btn row"></div>
            <label data-i18n="orSearch"></label>
            <input id="setCity" type="text">
            <label data-i18n="tvName"></label>
            <input id="setName" type="text">
            <div class="buttons">
                <div class="btn" id="btnSave" data-i18n="save"></div>
                <div class="btn" id="btnClose" data-i18n="cancel"></div>
            </div>
        </div>
    </div>

    <!-- Generic list picker: country / state / letter / town, search matches -->
    <div id="choice" class="overlay">
        <div class="sheet">
            <div class="sheetTitle" id="choiceTitle"></div>
            <div id="choiceView" class="view"><div id="choiceGrid" class="grid"></div></div>
        </div>
    </div>

    <script src="js/wallpapers.js"></script>
    <script src="js/places.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
